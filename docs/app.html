<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14110F" />
  <title>Oak &amp; Smoke Restaurant Hasilpur — PC &amp; Web App (POS · Kitchen · Admin · Menu)</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #14110F;
      --surface: #1E1916;
      --surface-2: #27201C;
      --border: #3B3028;
      --text: #F6EFE7;
      --muted: #B8AA9C;
      --amber: #E69445;
      --copper: #D16B3A;
      --green: #4CAF79;
      --red: #D9534F;
      --dark-ink: #14110F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; }
    .brand h1 { margin: 0; font-size: 18px; line-height: 1.2; }
    .brand small { color: var(--amber); font-size: 12px; font-weight: 600; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 700;
      border: 1px solid var(--border); background: var(--surface-2);
    }
    .pill.online { border-color: rgba(76,175,121,0.55); color: var(--green); background: rgba(76,175,121,0.12); }
    .pill.offline { border-color: rgba(209,107,58,0.65); color: var(--copper); background: rgba(209,107,58,0.16); }
    .pill.amber { border-color: rgba(230,148,69,0.55); color: var(--amber); background: rgba(230,148,69,0.14); }
    button, .btn {
      font: inherit; cursor: pointer; border-radius: 10px;
      padding: 9px 14px; font-weight: 700; font-size: 13px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      transition: transform 0.08s ease, background 0.15s ease;
    }
    button:hover { background: #332A24; }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--amber); color: var(--dark-ink); border-color: var(--amber); }
    .btn-primary:hover { background: #F0A358; }
    .btn-green { background: var(--green); color: var(--dark-ink); border-color: var(--green); }
    .btn-copper { background: var(--copper); color: var(--dark-ink); border-color: var(--copper); }
    .btn-danger { background: transparent; color: var(--red); border-color: var(--red); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      flex: 1;
      min-height: calc(100vh - 61px);
    }
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-btn {
      text-align: left; padding: 12px 14px; border-radius: 12px;
      background: transparent; border: 1px solid transparent; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-btn.active {
      background: rgba(230,148,69,0.16); color: var(--amber); border-color: rgba(230,148,69,0.45);
    }
    .nav-footer {
      margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 6px;
    }
    .nav-footer a { color: var(--amber); text-decoration: none; }
    main { padding: 18px; overflow-y: auto; max-width: 1440px; width: 100%; }

    .pos-grid {
      display: grid;
      grid-template-columns: 1.5fr 0.95fr;
      gap: 16px;
      align-items: start;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .card h2, .card h3 { margin: 0 0 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip {
      padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      cursor: pointer;
    }
    .chip.active { background: var(--amber); color: var(--dark-ink); border-color: var(--amber); }
    .chip.copper.active { background: var(--copper); color: var(--dark-ink); border-color: var(--copper); }

    .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-top: 10px; }
    input, select, textarea {
      width: 100%; padding: 9px 11px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font: inherit; font-size: 13px;
    }
    input:focus, select:focus { outline: none; border-color: var(--amber); }

    .dish-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; margin-top: 12px; }
    .dish-card {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 13px; display: flex; flex-direction: column; gap: 8px;
    }
    .dish-card.in-cart { border-color: var(--amber); }
    .dish-top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    .price { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; color: var(--amber); }
    .variety-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .v-btn {
      padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 600; text-align: left;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: flex; justify-content: space-between; gap: 4px;
    }
    .v-btn.active { background: var(--amber); color: var(--dark-ink); border-color: var(--amber); }
    .qty-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
    .qty-controls { display: flex; align-items: center; gap: 6px; }

    .ticket-panel { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 12px; }
    .ticket-items { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .ticket-line {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border);
      font-size: 13px;
    }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .kpi .val { font-family: ui-monospace, monospace; font-size: 22px; font-weight: 800; color: var(--amber); margin-top: 4px; }

    .kot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
    .kot-line { display: flex; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px dashed var(--border); }
    .kot-qty { background: rgba(230,148,69,0.2); color: var(--amber); font-weight: 800; padding: 2px 8px; border-radius: 6px; font-family: monospace; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--amber); border-radius: 16px;
      padding: 20px; max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto;
    }
    .toast {
      position: fixed; bottom: 18px; right: 18px; background: var(--amber); color: var(--dark-ink);
      padding: 11px 16px; border-radius: 12px; font-weight: 700; font-size: 13px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45); display: none; z-index: 80;
    }
    .toast.show { display: block; }

    @keyframes emberPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(209,107,58,0.45); opacity: 0.9; }
      50% { box-shadow: 0 0 0 8px rgba(209,107,58,0); opacity: 1; }
    }
    @keyframes riderGlide {
      0%, 100% { transform: translateX(-3px); }
      50% { transform: translateX(4px); }
    }
    @keyframes statusSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .status-banner {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface-2);
      animation: statusSlideIn 0.35s ease; transition: border-color 0.35s ease, background 0.35s ease;
    }
    .status-banner.grilling { border-color: rgba(209,107,58,0.75); background: rgba(209,107,58,0.14); }
    .status-banner.delivery { border-color: rgba(230,148,69,0.75); background: rgba(230,148,69,0.14); }
    .status-banner.done { border-color: rgba(76,175,121,0.75); background: rgba(76,175,121,0.14); }
    .status-icon-pulse {
      width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-size: 17px; background: rgba(230,148,69,0.18); flex-shrink: 0;
    }
    .status-banner.grilling .status-icon-pulse { animation: emberPulse 1.5s infinite ease-in-out; }
    .status-banner.delivery .status-icon-pulse span { display: inline-block; animation: riderGlide 1.1s infinite ease-in-out; }
    .progress-track {
      height: 5px; border-radius: 999px; background: var(--border); overflow: hidden; margin-top: 8px;
    }
    .progress-fill {
      height: 100%; border-radius: 999px; background: var(--amber); transition: width 0.5s cubic-bezier(0.22,1,0.36,1), background 0.35s ease;
    }
    .cat-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); font-size: 12px; font-weight: 600;
    }
    .cat-pill .cat-x {
      background: transparent; border: none; color: var(--red); padding: 0 2px; font-size: 14px; line-height: 1; cursor: pointer;
    }

    @keyframes alarmBorderPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217,83,79,0.55); border-color: rgba(217,83,79,0.95); }
      50% { box-shadow: 0 0 18px 2px rgba(217,83,79,0.35); border-color: var(--amber); }
    }
    @keyframes alarmBellRing {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-14deg) scale(1.12); }
      40% { transform: rotate(14deg) scale(1.12); }
      60% { transform: rotate(-10deg) scale(1.06); }
      80% { transform: rotate(10deg) scale(1.06); }
    }
    #incoming-alarm-banner {
      display: none;
      margin: 12px 18px 0;
      padding: 14px 16px;
      border-radius: 16px;
      border: 2px solid var(--red);
      background: rgba(217,83,79,0.16);
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    #incoming-alarm-banner.visible { display: flex; }
    #incoming-alarm-banner.ringing { animation: alarmBorderPulse 1.1s infinite ease-in-out; }
    .alarm-bell-badge {
      width: 42px; height: 42px; border-radius: 50%; background: var(--red); color: var(--dark-ink);
      display: inline-flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    #incoming-alarm-banner.ringing .alarm-bell-badge { animation: alarmBellRing 0.9s infinite ease-in-out; }
    .alarm-countdown {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; font-size: 15px;
      padding: 4px 10px; border-radius: 8px; background: var(--red); color: var(--dark-ink);
    }

    #print-area { display: none; }
    @media print {
      body > *:not(#print-area) { display: none !important; }
      #print-area {
        display: block !important;
        color: #000 !important;
        background: #fff !important;
        font-family: monospace;
        padding: 12px;
        max-width: 360px;
      }
    }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      aside { flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 10px; }
      .nav-footer { display: none; }
      .pos-grid { grid-template-columns: 1fr; }
      .ticket-panel { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="./icon.svg" alt="Oak &amp; Smoke Logo" />
      <div>
        <h1>Oak &amp; Smoke Restaurant Hasilpur</h1>
        <small>PC &amp; Web App · 25 Tables · 4 Varieties · Offline &amp; Online POS</small>
      </div>
    </div>
    <div class="header-actions">
      <span id="net-pill" class="pill online">● Online · Offline Ready</span>
      <span id="queue-pill" class="pill amber" style="display:none">0 Pending Sync</span>
      <button id="alarm-toggle-btn" class="btn-sm" onclick="toggleOrderAlarm()">🔔 3-Min Alarm: ON</button>
      <button id="alarm-test-btn" class="btn-sm" onclick="toggleTestOrderAlarm()">▶ Test Sound</button>
      <button id="download-app-btn" onclick="openPublicDownloadModal()">📱 Get Android App</button>
      <button id="install-pc-btn" class="btn-primary">⬇ Install on PC</button>
    </div>
  </header>

  <div id="incoming-alarm-banner" role="alert" aria-live="assertive"></div>

  <div class="layout">
    <aside>
      <button class="nav-btn active" data-portal="pos"><span>🔥 Staff Counter POS</span><span class="pill amber" id="badge-tables">25</span></button>
      <button class="nav-btn" data-portal="kitchen"><span>🍳 Kitchen Display (KOT)</span><span class="pill amber" id="badge-kot">0</span></button>
      <button class="nav-btn" data-portal="admin"><span>📊 Owner Admin Portal</span></button>
      <button class="nav-btn" data-portal="customer"><span>🍽️ Customer Digital Menu</span></button>
      <div class="nav-footer">
        <div><strong>PC Offline Storage:</strong> Active</div>
        <div>Install via Chrome/Edge for Start Menu &amp; Desktop icon.</div>
        <a href="./index.html">Google Play Privacy Policy</a>
      </div>
    </aside>

    <main id="portal-root"></main>
  </div>

  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal" id="modal-body"></div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="print-area"></div>

  <script>
    const STORAGE_KEYS = {
      MENU: 'oak_smoke_pc_menu_v1',
      CATEGORIES: 'oak_smoke_pc_categories_v1',
      TABLES: 'oak_smoke_pc_tables_v1',
      ORDERS: 'oak_smoke_pc_orders_v1',
      EXPENSES: 'oak_smoke_pc_expenses_v1'
    };
    const ANDROID_PLAY_URL = 'https://play.google.com/store/apps/details?id=com.aistudio.oakandsmoke.hsplrk';

    const STARTER_MENU = [
      { id: 'dish_mutton_karahi', name: 'Oak Smoked Mutton Karahi', category: 'KARAHI', desc: 'Tender goat simmered in fresh tomatoes, ginger & green chilies over oak embers.', available: true, special: true, varieties: [ {label:'Quarter (250g)', price:1950}, {label:'Half (500g)', price:2850}, {label:'Full (1 Kg)', price:5200}, {label:'Family Handi (1.5 Kg)', price:7400} ] },
      { id: 'dish_chicken_karahi', name: 'Desi Chicken Makhni Karahi', category: 'KARAHI', desc: 'Bone-in chicken finished with desi butter, crushed black pepper & fresh coriander.', available: true, special: false, varieties: [ {label:'Quarter', price:1150}, {label:'Half (500g)', price:1750}, {label:'Full (1 Kg)', price:3250}, {label:'Desi Ghee Special', price:3650} ] },
      { id: 'dish_white_karahi', name: 'Peshawari Charsi White Karahi', category: 'KARAHI', desc: 'Creamy yogurt, white pepper & char-grilled lamb infused with oak smoke.', available: true, special: false, varieties: [ {label:'Quarter', price:1650}, {label:'Half', price:2450}, {label:'Full (1 Kg)', price:4600}, {label:'Family Handi', price:6500} ] },
      { id: 'dish_royal_platter', name: 'Hasilpur Royal Oak BBQ Platter', category: 'PLATTERS', desc: 'Seekh Kebabs, Malai Boti, Chicken Tikka, Lamb Chops, Kabuli Pulao & Roghni Naan.', available: true, special: true, varieties: [ {label:'Couple (2p)', price:2650}, {label:'Family (4p)', price:4200}, {label:'Grand (6p)', price:6200}, {label:'Dastarkhwan (10p)', price:9800} ] },
      { id: 'dish_seekh_kebabs', name: 'Charcoal Beef Seekh Kebabs', category: 'BBQ', desc: 'Hand-minced spiced beef skewers flame-roasted over glowing oak wood.', available: true, special: false, varieties: [ {label:'Half (4 Skewers)', price:720}, {label:'Regular (6 Skewers)', price:1050}, {label:'Full Dozen (12)', price:1980}, {label:'Cheese Stuffed (6)', price:1280} ] },
      { id: 'dish_malai_boti', name: 'Smoked Chicken Malai Boti', category: 'BBQ', desc: 'Velvety cream and green cardamom marinated boneless cubes grilled crisp.', available: true, special: false, varieties: [ {label:'Half (6 pcs)', price:890}, {label:'Full (12 pcs)', price:1350}, {label:'Cheese Malai (12 pcs)', price:1580}, {label:'Family Pack (20 pcs)', price:2450} ] },
      { id: 'dish_lamb_chops', name: 'Oak-Fired Mutton Chops', category: 'BBQ', desc: 'Juicy rib chops glazed with black pepper, lemon & smoky tandoori crust.', available: true, special: true, varieties: [ {label:'4 Pieces', price:1750}, {label:'6 Pieces', price:2450}, {label:'8 Pieces', price:3150}, {label:'12 Pieces Family', price:4550} ] },
      { id: 'dish_roghni_naan', name: 'Tandoori Roghni & Garlic Naan', category: 'NAAN_SIDES', desc: 'Fresh clay-oven naan brushed with sesame butter and roasted garlic.', available: true, special: false, varieties: [ {label:'Plain Tandoori (2)', price:120}, {label:'Roghni Naan (2)', price:180}, {label:'Garlic Butter (2)', price:240}, {label:'Cheese Naan (2)', price:420} ] },
      { id: 'dish_mint_raita', name: 'Fresh Mint Raita & Kachumber', category: 'NAAN_SIDES', desc: 'Chilled house yogurt blended with green chilies, cumin & crisp salad.', available: true, special: false, varieties: [ {label:'Single Cup', price:150}, {label:'Standard Bowl', price:250}, {label:'Large Bowl', price:420}, {label:'Family Jug + Salad', price:680} ] },
      { id: 'dish_mint_margarita', name: 'Hasilpur Mint Margarita & Lassi', category: 'BEVERAGES', desc: 'Frosty crushed mint lime cooler or traditional sweet clay-cup lassi.', available: true, special: false, varieties: [ {label:'Regular Glass', price:280}, {label:'Large Glass', price:380}, {label:'Sweet Lassi Glass', price:340}, {label:'Family Pitcher (1.5L)', price:980} ] }
    ];

    function build25StarterTables() {
      const list = [];
      for (let i = 1; i <= 15; i++) {
        list.push({ id: `tbl_${i}`, label: `Table ${i}`, zone: 'CHARCOAL_HALL', capacity: i % 3 === 0 ? 6 : 4, available: true });
      }
      for (let i = 1; i <= 5; i++) {
        list.push({ id: `tbl_${15 + i}`, label: `Family Cabin ${i}`, zone: 'FAMILY_CABIN', capacity: i >= 4 ? 10 : 8, available: true });
      }
      for (let i = 1; i <= 5; i++) {
        list.push({ id: `tbl_${20 + i}`, label: `Outdoor Lawn ${i}`, zone: 'OUTDOOR_LAWN', capacity: 6, available: true });
      }
      return list;
    }

    const ZONES = {
      CHARCOAL_HALL: 'Charcoal Main Hall',
      FAMILY_CABIN: 'Family Cabin',
      OUTDOOR_LAWN: 'Outdoor Grill Lawn'
    };

    const STARTER_CATEGORIES = [
      { code: 'KARAHI', label: 'Karahi' },
      { code: 'BBQ', label: 'Smoked BBQ' },
      { code: 'PLATTERS', label: 'Platters' },
      { code: 'NAAN_SIDES', label: 'Naan & Sides' },
      { code: 'BEVERAGES', label: 'Beverages' }
    ];

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : fallback;
      } catch {
        return fallback;
      }
    }

    const state = {
      portal: (location.hash || '#pos').replace('#', '') || 'pos',
      categories: loadJson(STORAGE_KEYS.CATEGORIES, STARTER_CATEGORIES),
      menu: loadJson(STORAGE_KEYS.MENU, STARTER_MENU),
      tables: loadJson(STORAGE_KEYS.TABLES, build25StarterTables()),
      orders: loadJson(STORAGE_KEYS.ORDERS, []),
      expenses: loadJson(STORAGE_KEYS.EXPENSES, []),
      // POS transient state
      orderType: 'DINE_IN',
      zoneFilter: 'ALL',
      tableLabel: 'Table 1',
      customerName: '',
      customerPhone: '',
      deliveryAddress: '',
      notes: '',
      search: '',
      category: 'ALL',
      selectedVarietyByDish: {},
      posCart: {}, // key: "dishId::varietyLabel" -> qty
      custCart: {},
      custSearch: '',
      custCategory: 'ALL',
      custTableLabel: ''
    };

    function buildTableOrderUrl(table) {
      const base = `${location.origin}${location.pathname}`;
      return `${base}?table=${encodeURIComponent(table.id)}&label=${encodeURIComponent(table.label)}#customer`;
    }

    function applyTableFromUrl() {
      try {
        const params = new URLSearchParams(location.search);
        const rawId = (params.get('table') || params.get('tableId') || params.get('t') || '').trim();
        const rawLabel = (params.get('label') || params.get('tableLabel') || '').trim();
        if (!rawId && !rawLabel) return;
        const match =
          state.tables.find(t => t.id.toLowerCase() === rawId.toLowerCase()) ||
          state.tables.find(t => t.label.toLowerCase() === rawLabel.toLowerCase()) ||
          state.tables.find(t => t.label.toLowerCase() === rawId.toLowerCase()) ||
          (() => {
            const num = parseInt(rawId.replace(/\D/g, ''), 10);
            return (num >= 1 && num <= state.tables.length) ? state.tables[num - 1] : null;
          })();
        const resolved = match ? match.label : (rawLabel || rawId);
        if (resolved) {
          state.custTableLabel = resolved;
          state.portal = 'customer';
        }
      } catch (_) {}
    }

    function catLabel(code) {
      const found = state.categories.find(c => c.code === code);
      return found ? found.label : String(code || '').replace(/_/g, ' ');
    }

    function saveAll() {
      localStorage.setItem(STORAGE_KEYS.CATEGORIES, JSON.stringify(state.categories));
      localStorage.setItem(STORAGE_KEYS.MENU, JSON.stringify(state.menu));
      localStorage.setItem(STORAGE_KEYS.TABLES, JSON.stringify(state.tables));
      localStorage.setItem(STORAGE_KEYS.ORDERS, JSON.stringify(state.orders));
      localStorage.setItem(STORAGE_KEYS.EXPENSES, JSON.stringify(state.expenses));
    }

    function fmtPkr(n) {
      return 'Rs. ' + Number(n || 0).toLocaleString('en-PK');
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), 3200);
    }

    function cartKey(dishId, varietyLabel) {
      return `${dishId}::${varietyLabel}`;
    }

    function resolveLines(cartMap) {
      const lines = [];
      for (const [key, qty] of Object.entries(cartMap)) {
        if (qty <= 0) continue;
        const [dishId, vLabel] = key.split('::');
        const dish = state.menu.find(d => d.id === dishId);
        if (!dish) continue;
        const v = (dish.varieties || []).find(x => x.label === vLabel) || dish.varieties[0];
        lines.push({
          key,
          dishId,
          name: `${dish.name} (${v.label})`,
          qty,
          unitPrice: v.price,
          lineTotal: v.price * qty
        });
      }
      return lines;
    }

    function updateNetworkBadge() {
      const online = navigator.onLine;
      const pill = document.getElementById('net-pill');
      pill.className = 'pill ' + (online ? 'online' : 'offline');
      pill.textContent = online ? '● Online · Offline Ready' : '● Offline Mode · Saving Locally';

      const pendingCount = state.orders.filter(o => o.pendingSync).length;
      const qPill = document.getElementById('queue-pill');
      if (online && pendingCount > 0) {
        // Mark locally queued orders synced once online returns
        state.orders.forEach(o => { if (o.pendingSync) o.pendingSync = false; });
        saveAll();
        showToast(`Synced ${pendingCount} offline order(s) successfully!`);
      }
      const remaining = state.orders.filter(o => o.pendingSync).length;
      qPill.style.display = remaining > 0 ? 'inline-flex' : 'none';
      qPill.textContent = `${remaining} Offline Queued`;

      document.getElementById('badge-tables').textContent = state.tables.filter(t => t.available).length;
      document.getElementById('badge-kot').textContent = state.orders.filter(o => ['PLACED','GRILLING','READY'].includes(o.status)).length;
    }

    }

                    <button class="btn-sm btn-primary" onclick="printBillById('${o.id}')">Bill</button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderCustomer() {
      const visibleMenu = state.menu.filter(d => {
        const catOk = state.custCategory === 'ALL' || d.category === state.custCategory;
        const q = state.custSearch.trim().toLowerCase();
        const qOk = !q || d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q);
        return d.available && catOk && qOk;
      });
      const lines = resolveLines(state.custCart);
      const total = lines.reduce((s, l) => s + l.lineTotal, 0);
      const isTableMode = Boolean(state.custTableLabel);

      return `
        <div class="pos-grid">
          <div class="card">
            <div style="margin-bottom:12px;padding:12px 14px;border-radius:12px;border:1px solid ${isTableMode ? 'var(--green)' : 'rgba(230,148,69,0.55)'};background:${isTableMode ? 'rgba(76,175,121,0.12)' : 'rgba(230,148,69,0.08)'};display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
              <div>
                <strong style="color:${isTableMode ? 'var(--green)' : 'var(--amber)'};">
                  ${isTableMode ? `🍽️ Seated at ${escapeHtml(state.custTableLabel)} · Direct Table QR Ordering` : '📱 Dining at Oak & Smoke? Order Directly from Your Table'}
                </strong>
                <div class="muted" style="font-size:12px;">
                  ${isTableMode ? 'Orders fire straight to the Kitchen for your table — no delivery address required.' : 'Scan your table QR card or pick Table 1–25 to send orders straight to Kitchen.'}
                </div>
              </div>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <select style="width:auto;min-width:170px;" onchange="setCustomerTable(this.value)">
                  <option value="">COD Delivery (No Table)</option>
                  ${state.tables.filter(t => t.available).map(t => `
                    <option value="${escapeHtml(t.label)}" ${state.custTableLabel === t.label ? 'selected' : ''}>${escapeHtml(t.label)} (${t.capacity}p)</option>
                  `).join('')}
                </select>
                ${isTableMode ? `<button class="btn-sm btn-danger" onclick="setCustomerTable('')">Switch to Delivery</button>` : ''}
              </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
              <div>
                <h2>Oak &amp; Smoke Digital Menu (Hasilpur)</h2>
                <div class="muted">Authentic Pakistani Karahi, Smoked BBQ &amp; Platters · Choose from 4 varieties per dish · ${isTableMode ? 'Direct Table Dine-In' : 'Cash on Delivery'}</div>
              </div>
              <input style="max-width:260px;" placeholder="Search menu..." value="${escapeHtml(state.custSearch)}" oninput="state.custSearch=this.value;render()" />
            </div>
            <div class="chip-row">
              <button class="chip ${state.custCategory === 'ALL' ? 'active' : ''}" onclick="state.custCategory='ALL';render()">All Menu</button>
              ${state.categories.map(c => `
                <button class="chip ${state.custCategory === c.code ? 'active' : ''}" onclick="state.custCategory='${escapeHtml(c.code)}';render()">${escapeHtml(c.label)}</button>
              `).join('')}
            </div>
            <div class="dish-list">
              ${visibleMenu.map(dish => {
                const selIdx = state.selectedVarietyByDish['c_' + dish.id] || 0;
                const activeV = dish.varieties[selIdx] || dish.varieties[0];
                const k = cartKey(dish.id, activeV.label);
                const qty = state.custCart[k] || 0;
                return `
                  <div class="dish-card">
                    <div class="dish-top">
                      <div>
                        <strong>${escapeHtml(dish.name)}</strong>
                        <div class="muted" style="font-size:12px;">${escapeHtml(dish.desc)}</div>
                      </div>
                      <span class="price">${fmtPkr(activeV.price)}</span>
                    </div>
                    <div class="variety-grid">
                      ${dish.varieties.map((v, idx) => `
                        <button class="v-btn ${idx === selIdx ? 'active' : ''}" onclick="selectDishVariety('c_${dish.id}', ${idx})">
                          <span>${escapeHtml(v.label)}</span>
                          <span>${v.price}</span>
                        </button>`).join('')}
                    </div>
                    <div class="qty-bar">
                      <span class="muted" style="font-size:12px;">${escapeHtml(activeV.label)}</span>
                      <div class="qty-controls">
                        ${qty > 0 ? `<button class="btn-sm" onclick="updateCart('custCart','${escapeHtml(k)}',-1)">−</button><strong>${qty}</strong>` : ''}
                        <button class="btn-sm btn-primary" onclick="updateCart('custCart','${escapeHtml(k)}',1)">${isTableMode ? '+ Add to Table' : '+ Add to COD Cart'}</button>
                      </div>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>

          <div class="card ticket-panel" style="${isTableMode ? 'border-color:var(--green);' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <h2 style="color:${isTableMode ? 'var(--green)' : 'var(--amber)'};margin:0;">
                ${isTableMode ? `🍽️ ${escapeHtml(state.custTableLabel)} Order` : 'Customer COD Cart'}
              </h2>
              <span class="pill ${isTableMode ? 'online' : 'amber'}">${isTableMode ? 'TABLE QR' : 'COD'}</span>
            </div>
            <div class="ticket-items">
              ${lines.length === 0 ? `<div class="muted">${isTableMode ? `Your ${escapeHtml(state.custTableLabel)} tray is empty. Pick a dish variety to add items.` : 'Your COD cart is empty. Pick a dish variety to add items.'}</div>` : lines.map(l => `
                <div class="ticket-line">
                  <div>
                    <strong>${escapeHtml(l.name)}</strong>
                    <div class="price" style="font-size:12px;">${l.qty} × ${fmtPkr(l.unitPrice)} = ${fmtPkr(l.lineTotal)}</div>
                  </div>
                  <div class="qty-controls">
                    <button class="btn-sm" onclick="updateCart('custCart','${escapeHtml(l.key)}',-1)">−</button>
                    <strong>${l.qty}</strong>
                    <button class="btn-sm btn-primary" onclick="updateCart('custCart','${escapeHtml(l.key)}',1)">+</button>
                  </div>
                </div>
              `).join('')}
            </div>
            <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between;">
              <strong>${isTableMode ? 'Pay at Counter / Table' : 'COD Payable'}</strong>
              <span class="price" style="font-size:20px;${isTableMode ? 'color:var(--green);' : ''}">${fmtPkr(total)}</span>
            </div>
            <div class="input-grid" style="grid-template-columns:1fr;">
              <input id="cust-name" placeholder="Your Full Name ${isTableMode ? '(optional)' : ''}" />
              <input id="cust-phone" placeholder="Mobile Number ${isTableMode ? '(optional)' : '(e.g. 0300-1234567)'}" />
              ${isTableMode
                ? `<input id="cust-notes" placeholder="Kitchen Notes (spice level, serve order)" />`
                : `<input id="cust-addr" placeholder="Hasilpur Delivery Address" />`}
            </div>
            <button class="${isTableMode ? 'btn-green' : 'btn-primary'}" ${lines.length===0?'disabled':''} onclick="submitCustomerCodOrder()">
              ${isTableMode ? `🔥 Send Direct to Kitchen (${escapeHtml(state.custTableLabel)})` : 'Place Cash on Delivery Order'}
            </button>

            ${state.orders.length > 0 ? `
              <div style="border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px;">
                <strong style="color:var(--amber);">Live Order Status Tracker</strong>
                ${state.orders.slice(0, 3).map(o => {
                  const meta = o.status === 'GRILLING'
                    ? { cls: 'grilling', icon: '🔥', title: 'Preparing on Charcoal Grill', pct: 45 }
                    : o.status === 'READY'
                    ? { cls: 'done', icon: '🍽️', title: 'Ready at Kitchen Counter', pct: 68 }
                    : o.status === 'OUT_FOR_DELIVERY'
                    ? { cls: 'delivery', icon: '🛵', title: 'Rider Out for Delivery', pct: 86 }
                    : o.status === 'DELIVERED'
                    ? { cls: 'done', icon: '✅', title: 'Delivered · Completed', pct: 100 }
                    : { cls: '', icon: '🧾', title: 'Order Placed · Sent to Kitchen', pct: 20 };
                  return `
                    <div class="status-banner ${meta.cls}">
                      <div class="status-icon-pulse"><span>${meta.icon}</span></div>
                      <div style="flex:1;">
                        <div style="display:flex;justify-content:space-between;font-size:12px;">
                          <strong>${escapeHtml(o.orderNumber)}</strong>
                          <span class="price">${fmtPkr(o.totalPkr)}</span>
                        </div>
                        <div class="muted" style="font-size:12px;color:var(--text);">${meta.title}</div>
                        <div class="progress-track"><div class="progress-fill" style="width:${meta.pct}%;${o.status==='DELIVERED'?'background:var(--green);':''}"></div></div>
                      </div>
                    </div>`;
                }).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    function render() {
      document.querySelectorAll('.nav-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.portal === state.portal);
      });
      const root = document.getElementById('portal-root');
      if (state.portal === 'kitchen') root.innerHTML = renderKitchen();
      else if (state.portal === 'admin') root.innerHTML = renderAdmin();
      else if (state.portal === 'customer') root.innerHTML = renderCustomer();
      else root.innerHTML = renderPos();
      updateNetworkBadge();
    }

    // Actions
    window.setOrderType = (t) => { state.orderType = t; render(); };
    window.setZoneFilter = (z) => { state.zoneFilter = z; render(); };
    window.selectTable = (lbl) => { state.tableLabel = lbl; render(); };
    window.selectDishVariety = (dishId, idx) => { state.selectedVarietyByDish[dishId] = idx; render(); };
    window.updateCart = (cartName, key, delta) => {
      const next = (state[cartName][key] || 0) + delta;
      if (next <= 0) delete state[cartName][key];
      else state[cartName][key] = next;
      render();
    };

    window.submitPosOrder = () => {
      const lines = resolveLines(state.posCart);
      if (!lines.length) return;
      if (state.orderType === 'COD_DELIVERY' && (state.customerPhone.trim().length < 7 || state.deliveryAddress.trim().length < 4)) {
        showToast('Enter customer phone & Hasilpur address for Phone COD.');
        return;
      }
      const order = {
        id: 'ord_' + Date.now(),
        orderNumber: 'OS-' + String(Math.floor(1000 + Math.random() * 9000)),
        orderType: state.orderType,
        tableLabel: state.orderType === 'DINE_IN' ? state.tableLabel : '',
        customerName: state.customerName.trim() || (state.orderType === 'DINE_IN' ? state.tableLabel : 'Walk-In Guest'),
        customerPhone: state.customerPhone.trim(),
        deliveryAddress: state.orderType === 'COD_DELIVERY' ? state.deliveryAddress.trim() : '',
        notes: state.notes.trim(),
        lines,
        totalPkr: lines.reduce((s, l) => s + l.lineTotal, 0),
        status: 'PLACED',
        pendingSync: !navigator.onLine,
        createdAt: Date.now()
      };
      state.orders.unshift(order);
      state.posCart = {};
      state.customerName = '';
      state.customerPhone = '';
      state.deliveryAddress = '';
      state.notes = '';
      saveAll();
      render();
      openPostOrderModal(order);
    };

    window.setCustomerTable = (label) => {
      state.custTableLabel = (label || '').trim();
      if (state.custTableLabel) {
        showToast(`Seated at ${state.custTableLabel} — direct table ordering active!`);
      } else {
        showToast('Switched to COD Delivery mode.');
      }
      render();
    };

    window.submitCustomerCodOrder = () => {
      const lines = resolveLines(state.custCart);
      if (!lines.length) return;
      const name = (document.getElementById('cust-name')?.value || '').trim();
      const phone = (document.getElementById('cust-phone')?.value || '').trim();
      const isTableMode = Boolean(state.custTableLabel);
      if (isTableMode) {
        const notes = (document.getElementById('cust-notes')?.value || '').trim();
        const order = {
          id: 'ord_' + Date.now(),
          orderNumber: 'OS-' + String(Math.floor(1000 + Math.random() * 9000)),
          orderType: 'DINE_IN',
          tableLabel: state.custTableLabel,
          customerName: name || state.custTableLabel,
          customerPhone: phone,
          deliveryAddress: '',
          notes: notes || `Table QR Self-Order (${state.custTableLabel})`,
          lines,
          totalPkr: lines.reduce((s, l) => s + l.lineTotal, 0),
          status: 'PLACED',
          pendingSync: !navigator.onLine,
          createdAt: Date.now()
        };
        state.orders.unshift(order);
        state.custCart = {};
        saveAll();
        triggerIncomingOrderAlarm(180);
        showToast(`Table Order ${order.orderNumber} for ${state.custTableLabel} sent straight to Kitchen!`);
        render();
        return;
      }
      const addr = (document.getElementById('cust-addr')?.value || '').trim();
      if (phone.length < 7 || addr.length < 4) {
        showToast('Please enter your phone number and Hasilpur delivery address.');
        return;
      }
      const order = {
        id: 'ord_' + Date.now(),
        orderNumber: 'OS-' + String(Math.floor(1000 + Math.random() * 9000)),
        orderType: 'COD_DELIVERY',
        tableLabel: '',
        customerName: name || 'Hasilpur Customer',
        customerPhone: phone,
        deliveryAddress: addr,
        notes: 'Customer Web App COD Order',
        lines,
        totalPkr: lines.reduce((s, l) => s + l.lineTotal, 0),
        status: 'PLACED',
        pendingSync: !navigator.onLine,
        createdAt: Date.now()
      };
      state.orders.unshift(order);
      state.custCart = {};
      saveAll();
      triggerIncomingOrderAlarm(180);
      showToast(`COD Order ${order.orderNumber} sent to Oak & Smoke Kitchen!`);
      render();
    };

    window.advanceOrder = (id, status) => {
      const o = state.orders.find(x => x.id === id);
      if (!o) return;
      o.status = status;
      saveAll();
      syncAlarmWithOrders();
      showToast(`${o.orderNumber} → ${status}`);
      render();
    };

    window.acceptIncomingOrder = (id) => {
      const o = state.orders.find(x => x.id === id);
      if (!o) return;
      o.status = 'GRILLING';
      alarmState.silencedIds.add(id);
      alarmState.testActive = false;
      saveAll();
      syncAlarmWithOrders();
      showToast(`✓ Accepted ${o.orderNumber} — Preparing on Charcoal Grill!`);
      render();
    };

    window.rejectIncomingOrder = (id) => {
      const o = state.orders.find(x => x.id === id);
      if (!o) return;
      if (!confirm(`Reject and cancel order ${o.orderNumber} (${fmtPkr(o.totalPkr)})? This will stop the order alarm.`)) return;
      o.status = 'CANCELLED';
      alarmState.silencedIds.add(id);
      alarmState.testActive = false;
      saveAll();
      syncAlarmWithOrders();
      showToast(`✕ Rejected ${o.orderNumber} — Alarm stopped.`);
      render();
    };

    window.printKotById = (id) => {
      const o = state.orders.find(x => x.id === id);
      if (o) printKot(o);
    };
    window.printBillById = (id) => {
      const o = state.orders.find(x => x.id === id);
      if (o) printBill(o);
    };

    window.toggleTable = (id) => {
      const t = state.tables.find(x => x.id === id);
      if (t) { t.available = !t.available; saveAll(); render(); }
    };
    window.reset25Tables = () => {
      state.tables = build25StarterTables();
      saveAll();
      showToast('All 25 Oak & Smoke tables loaded!');
      render();
    };

    window.deleteDish = (id) => {
      state.menu = state.menu.filter(d => d.id !== id);
      saveAll();
      showToast('Dish removed from menu.');
      render();
    };

    function openModal(html) {
      document.getElementById('modal-body').innerHTML = html;
      document.getElementById('modal-backdrop').classList.add('open');
    }
    window.closeModal = () => document.getElementById('modal-backdrop').classList.remove('open');

    function openPostOrderModal(order) {
      openModal(`
        <h2 style="color:var(--green);margin-top:0;">✓ Order ${escapeHtml(order.orderNumber)} Created</h2>
        <div class="pill ${order.pendingSync ? 'offline' : 'online'}" style="margin-bottom:10px;">
          ${order.pendingSync ? 'Saved Offline · Auto-Syncs Online' : 'Sent Direct to Kitchen'}
        </div>
        <p>${order.lines.map(l => `${l.qty}x ${escapeHtml(l.name)}`).join('<br/>')}</p>
        <p class="price" style="font-size:18px;">Total: ${fmtPkr(order.totalPkr)}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;">
          <button class="btn-copper" style="flex:1;" onclick="printKotById('${order.id}')">🖨 Print KOT (Kitchen Only)</button>
          <button class="btn-primary" style="flex:1;" onclick="printBillById('${order.id}')">🧾 Print Customer Bill</button>
        </div>
        <div style="margin-top:12px;text-align:right;">
          <button onclick="closeModal()">Done / New Order</button>
        </div>
      `);
    }

    window.openAddCategoryModal = () => {
      openModal(`
        <h2 style="margin-top:0;color:var(--amber);">Add Menu Category</h2>
        <p class="muted">Create a new category (e.g. Desserts, Handi, Fast Food, Tea &amp; Kahwa).</p>
        <input id="new-cat-label" placeholder="Category Name" />
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
          <button onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveNewCategory()">Add Category</button>
        </div>
      `);
    };

    window.saveNewCategory = () => {
      const label = (document.getElementById('new-cat-label')?.value || '').trim();
      if (label.length < 2) { showToast('Enter a category name (at least 2 letters).'); return; }
      const code = label.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 36);
      if (code.length < 2) { showToast('Use letters or numbers for the category name.'); return; }
      if (state.categories.some(c => c.code === code)) {
        showToast('That category already exists.');
        return;
      }
      state.categories.push({ code, label });
      saveAll();
      closeModal();
      showToast(`Category "${label}" added!`);
      render();
    };

    window.removeCategory = (code) => {
      if (state.categories.length <= 1) { showToast('Keep at least one category.'); return; }
      const target = state.categories.find(c => c.code === code);
      state.categories = state.categories.filter(c => c.code !== code);
      if (state.category === code) state.category = 'ALL';
      if (state.custCategory === code) state.custCategory = 'ALL';
      saveAll();
      showToast(`Removed category "${target ? target.label : code}".`);
      render();
    };

    window.openPublicDownloadModal = () => {
      openModal(`
        <h2 style="margin-top:0;color:var(--amber);">Download Oak &amp; Smoke App</h2>
        <p class="muted">Open for everyone in Hasilpur — download the Android app or install directly on your PC with no verification code required.</p>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
          <a class="btn btn-primary" style="text-align:center;text-decoration:none;" href="${ANDROID_PLAY_URL}" target="_blank" rel="noopener">📱 Download Android App (Google Play)</a>
          <button class="btn-green" onclick="closeModal();document.getElementById('install-pc-btn').click();">💻 Install PC / Desktop App (Windows &amp; Mac)</button>
          <button onclick="navigator.clipboard?.writeText('${ANDROID_PLAY_URL}').then(()=>showToast('Public download link copied!'))">📋 Copy Public Download Link</button>
        </div>
        <div style="margin-top:14px;text-align:right;">
          <button onclick="closeModal()">Close</button>
        </div>
      `);
    };

    window.openAllTableQrsModal = () => {
      const rows = state.tables.map(t => {
        const url = buildTableOrderUrl(t);
        const zoneName = ZONES[t.zone] || t.zone;
        return `
          <div class="ticket-line" style="flex-direction:column;align-items:stretch;gap:6px;">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
              <div>
                <strong style="color:var(--amber);">${escapeHtml(t.label)}</strong>
                <span class="muted"> · ${escapeHtml(zoneName)} (${t.capacity}p)</span>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn-sm" onclick="navigator.clipboard?.writeText('${escapeHtml(url)}').then(()=>showToast('Copied ${escapeHtml(t.label)} QR link!'))">📋 Copy</button>
                <button class="btn-sm btn-green" onclick="closeModal();state.portal='customer';setCustomerTable('${escapeHtml(t.label)}')">Open Menu</button>
              </div>
            </div>
            <div style="font-family:monospace;font-size:11px;color:var(--muted);word-break:break-all;">${escapeHtml(url)}</div>
          </div>`;
      }).join('');
      openModal(`
        <h2 style="margin-top:0;color:var(--amber);">25 Unique Table QR Ordering Links</h2>
        <p class="muted">Each table has its own direct-order link. Print scannable QR table tents from the Oak &amp; Smoke Android app (Owner &rarr; Tables &rarr; All QRs) or print this link sheet below.</p>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <button class="btn-primary" style="flex:1;" onclick="printTableLinksSheet()">🖨 Print All ${state.tables.length} Table Cards</button>
          <button onclick="closeModal()">Close</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;">
          ${rows}
        </div>
      `);
    };

    window.printTableLinksSheet = () => {
      const cards = state.tables.map(t => `
        <div style="border:1px solid #000;padding:10px;margin-bottom:10px;page-break-inside:avoid;">
          <div style="font-weight:bold;font-size:14px;">OAK &amp; SMOKE HASILPUR</div>
          <div style="font-size:18px;font-weight:bold;margin:4px 0;">${escapeHtml(t.label)} (${t.capacity} Guests)</div>
          <div style="font-size:11px;">${escapeHtml(ZONES[t.zone] || t.zone)}</div>
          <div style="font-size:10px;word-break:break-all;margin-top:6px;">${escapeHtml(buildTableOrderUrl(t))}</div>
        </div>
      `).join('');
      printDocument(`
        <h2 style="text-align:center;margin:0 0 10px;">OAK &amp; SMOKE — 25 TABLE ORDERING LINKS</h2>
        ${cards}
      `);
    };

    window.openDishModal = (dishId) => {
      const d = dishId ? state.menu.find(x => x.id === dishId) : null;
      const vs = d ? d.varieties : [
        { label: 'Regular', price: 950 },
        { label: 'Half', price: 1450 },
        { label: 'Full', price: 2450 },
        { label: 'Family', price: 3850 }
      ];
      openModal(`
        <h2 style="margin-top:0;">${d ? 'Edit Dish & 4 Varieties' : 'Add Dish (4 Varieties)'}</h2>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <input id="m-name" placeholder="Dish Name" value="${escapeHtml(d?.name || '')}" />
          <select id="m-cat">
            ${state.categories.map(c => `<option value="${escapeHtml(c.code)}" ${d?.category===c.code?'selected':''}>${escapeHtml(c.label)}</option>`).join('')}
          </select>
          <input id="m-desc" placeholder="Short description" value="${escapeHtml(d?.desc || '')}" />
          <strong style="color:var(--amber);margin-top:4px;">4 Product Varieties (Name + PKR Price)</strong>
          ${[0,1,2,3].map(i => `
            <div style="display:grid;grid-template-columns:1.3fr 0.8fr;gap:6px;">
              <input id="m-vl-${i}" placeholder="Variety ${i+1} Name" value="${escapeHtml(vs[i]?.label || '')}" />
              <input id="m-vp-${i}" type="number" placeholder="PKR" value="${vs[i]?.price || ''}" />
            </div>
          `).join('')}
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
          <button onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveDishFromModal('${dishId || ''}')">Save Dish</button>
        </div>
      `);
    };

    window.saveDishFromModal = (dishId) => {
      const name = document.getElementById('m-name').value.trim();
      const cat = document.getElementById('m-cat').value;
      const desc = document.getElementById('m-desc').value.trim();
      const varieties = [];
      for (let i = 0; i < 4; i++) {
        const lbl = document.getElementById(`m-vl-${i}`).value.trim();
        const price = parseInt(document.getElementById(`m-vp-${i}`).value, 10);
        if (lbl && price >= 50) varieties.push({ label: lbl, price });
      }
      if (name.length < 2 || !varieties.length) {
        showToast('Enter a dish name and at least 1 variety with price >= Rs. 50.');
        return;
      }
      if (dishId) {
        const idx = state.menu.findIndex(x => x.id === dishId);
        if (idx >= 0) state.menu[idx] = { ...state.menu[idx], name, category: cat, desc, varieties };
      } else {
        state.menu.unshift({ id: 'dish_' + Date.now(), name, category: cat, desc, available: true, special: false, varieties });
      }
      saveAll();
      closeModal();
      showToast(`Saved ${name} (${varieties.length} varieties).`);
      render();
    };

    window.openExpenseModal = () => {
      openModal(`
        <h2 style="margin-top:0;">Log Operating Expense</h2>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <input id="e-title" placeholder="Expense Title (e.g. Oak Charcoal, Mutton)" />
          <input id="e-amt" type="number" placeholder="Amount (PKR)" />
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;">
          <button onclick="closeModal()">Cancel</button>
          <button class="btn-primary" onclick="saveExpenseFromModal()">Save Expense</button>
        </div>
      `);
    };

    window.saveExpenseFromModal = () => {
      const title = document.getElementById('e-title').value.trim();
      const amountPkr = parseInt(document.getElementById('e-amt').value, 10) || 0;
      if (title.length < 2 || amountPkr <= 0) { showToast('Enter valid expense title and PKR amount.'); return; }
      state.expenses.unshift({ id: 'exp_' + Date.now(), title, amountPkr, createdAt: Date.now() });
      saveAll();
      closeModal();
      showToast('Expense logged.');
      render();
    };

    window.exportCsvReport = () => {
      const rows = [['OrderNumber','Type','Table','Status','TotalPKR','Items','Timestamp']];
      state.orders.forEach(o => {
        rows.push([
          o.orderNumber,
          o.orderType,
          o.tableLabel || '',
          o.status,
          o.totalPkr,
          o.lines.map(l => `${l.qty}x ${l.name}`).join('; '),
          new Date(o.createdAt).toISOString()
        ]);
      });
      const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `OakAndSmoke_PC_Report_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV sales report downloaded to your PC!');
    };

    // Portal navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.portal = btn.dataset.portal;
        history.replaceState(null, '', '#' + state.portal);
        render();
      });
    });

    // PC PWA Installation (beforeinstallprompt) + fallback guide
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
    });

    document.getElementById('install-pc-btn').addEventListener('click', async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        const choice = await deferredInstallPrompt.userChoice;
        if (choice.outcome === 'accepted') {
          showToast('Oak & Smoke is installing on your PC!');
        }
        deferredInstallPrompt = null;
      } else {
        openModal(`
          <h2 style="margin-top:0;color:var(--amber);">Install Oak &amp; Smoke on Your PC</h2>
          <p>Run Oak &amp; Smoke as a standalone Windows, Mac, Linux, or Chromebook desktop app with full offline support:</p>
          <ol style="line-height:1.8;padding-left:20px;">
            <li>Open this page in <strong>Google Chrome</strong> or <strong>Microsoft Edge</strong> on your PC.</li>
            <li>Click the <strong>Install icon (⊕ / ⬇)</strong> on the right side of the browser address bar — or open the browser menu (⋮) &rarr; <strong>Cast, save, and share &rarr; Install Oak &amp; Smoke</strong>.</li>
            <li>Pin <strong>Oak &amp; Smoke</strong> to your Windows Taskbar / Mac Dock to launch Counter POS, Kitchen KOT, Admin &amp; Menu anytime — online or offline.</li>
          </ol>
          <div style="text-align:right;margin-top:14px;">
            <button class="btn-primary" onclick="closeModal()">Got It</button>
          </div>
        `);
      }
    });

    // 3-Minute Continuous Incoming Order Sound Alarm Engine (Offline Web Audio API)
    const ALARM_DURATION_SEC = 180;
    const alarmState = {
      enabled: true,
      testActive: false,
      remainingSec: 0,
      audioUnlocked: false,
      audioCtx: null,
      countdownTimer: null,
      ringTimer: null,
      silencedIds: new Set()
    };

    function formatAlarmTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function ensureAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!alarmState.audioCtx) {
        alarmState.audioCtx = new Ctx();
      }
      if (alarmState.audioCtx.state === 'suspended') {
        alarmState.audioCtx.resume().then(() => {
          alarmState.audioUnlocked = true;
          renderIncomingAlarmBanner();
        }).catch(() => {});
      } else {
        alarmState.audioUnlocked = true;
      }
      return alarmState.audioCtx;
    }

    function playContinuousRingBurst() {
      const ctx = ensureAudioContext();
      if (!ctx || ctx.state !== 'running') return;
      const now = ctx.currentTime;
      // Dual-tone continuous telephone / kitchen order ring cadence
      const tones = [
        { start: 0.0, dur: 0.24, freqA: 880, freqB: 1175 },
        { start: 0.30, dur: 0.28, freqA: 988, freqB: 1318 }
      ];
      tones.forEach(t => {
        [t.freqA, t.freqB].forEach(freq => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + t.start);
          gain.gain.setValueAtTime(0.0001, now + t.start);
          gain.gain.exponentialRampToValueAtTime(0.18, now + t.start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + t.start + t.dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + t.start);
          osc.stop(now + t.start + t.dur + 0.02);
        });
      });
    }

    function getPendingPlacedOrders() {
      return state.orders.filter(o => o.status === 'PLACED');
    }

    function isStaffOrAdminPortal() {
      return state.portal !== 'customer';
    }

    function shouldAlarmRingNow() {
      if (!isStaffOrAdminPortal()) return false;
      if (alarmState.remainingSec <= 0) return false;
      if (alarmState.testActive) return true;
      if (!alarmState.enabled) return false;
      return getPendingPlacedOrders().some(o => !alarmState.silencedIds.has(o.id));
    }

    function startAudioRingLoop() {
      if (alarmState.ringTimer) return;
      playContinuousRingBurst();
      alarmState.ringTimer = setInterval(() => {
        if (shouldAlarmRingNow()) {
          playContinuousRingBurst();
        } else {
          stopAudioRingLoop();
        }
      }, 1050);
    }

    function stopAudioRingLoop() {
      if (alarmState.ringTimer) {
        clearInterval(alarmState.ringTimer);
        alarmState.ringTimer = null;
      }
    }

    function stopAlarmCountdown() {
      if (alarmState.countdownTimer) {
        clearInterval(alarmState.countdownTimer);
        alarmState.countdownTimer = null;
      }
      alarmState.remainingSec = 0;
      alarmState.testActive = false;
      stopAudioRingLoop();
    }

    function triggerIncomingOrderAlarm(seconds = ALARM_DURATION_SEC) {
      if (!alarmState.enabled && !alarmState.testActive) {
        renderIncomingAlarmBanner();
        return;
      }
      alarmState.remainingSec = Math.max(0, Math.min(ALARM_DURATION_SEC, Math.floor(seconds)));
      if (alarmState.countdownTimer) clearInterval(alarmState.countdownTimer);
      alarmState.countdownTimer = setInterval(() => {
        if (alarmState.remainingSec > 0) {
          alarmState.remainingSec -= 1;
        }
        if (alarmState.remainingSec <= 0) {
          stopAlarmCountdown();
        }
        renderIncomingAlarmBanner();
      }, 1000);
      syncAlarmAudioPlayback();
      renderIncomingAlarmBanner();
    }

    function syncAlarmAudioPlayback() {
      if (shouldAlarmRingNow()) {
        startAudioRingLoop();
      } else {
        stopAudioRingLoop();
      }
    }

    function syncAlarmWithOrders() {
      const pending = getPendingPlacedOrders();
      const pendingIdSet = new Set(pending.map(o => o.id));
      for (const id of Array.from(alarmState.silencedIds)) {
        if (!pendingIdSet.has(id)) alarmState.silencedIds.delete(id);
      }
      const hasUnsilenced = pending.some(o => !alarmState.silencedIds.has(o.id));
      if (!hasUnsilenced && !alarmState.testActive) {
        stopAlarmCountdown();
      } else {
        syncAlarmAudioPlayback();
      }
      renderIncomingAlarmBanner();
    }

    function renderIncomingAlarmBanner() {
      const toggleBtn = document.getElementById('alarm-toggle-btn');
      const testBtn = document.getElementById('alarm-test-btn');
      if (toggleBtn) {
        toggleBtn.textContent = alarmState.enabled ? '🔔 3-Min Alarm: ON' : '🔕 Alarm: OFF';
        toggleBtn.className = alarmState.enabled ? 'btn-sm btn-green' : 'btn-sm';
      }
      if (testBtn) {
        testBtn.textContent = alarmState.testActive ? '■ Stop Test' : '▶ Test Sound';
        testBtn.className = alarmState.testActive ? 'btn-sm btn-danger' : 'btn-sm';
      }

      const banner = document.getElementById('incoming-alarm-banner');
      if (!banner) return;

      const pending = getPendingPlacedOrders();
      const show = isStaffOrAdminPortal() && (pending.length > 0 || alarmState.testActive);
      banner.classList.toggle('visible', show);
      const ringing = shouldAlarmRingNow();
      banner.classList.toggle('ringing', show && ringing);
      if (!show) {
        banner.innerHTML = '';
        return;
      }

      const newest = pending[0] || null;
      const pct = Math.max(0, Math.min(100, Math.round((alarmState.remainingSec / ALARM_DURATION_SEC) * 100)));
      const audioHint = (!alarmState.audioUnlocked && ringing)
        ? `<button class="btn-sm btn-primary" onclick="ensureAudioContext();playContinuousRingBurst();">🔊 Click to Enable Browser Sound</button>`
        : '';

      if (newest) {
        const origin = newest.tableLabel ? newest.tableLabel : newest.orderType;
        const summary = newest.lines.map(l => `${l.qty}x ${escapeHtml(l.name)}`).join(', ');
        banner.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:260px;">
            <div class="alarm-bell-badge">🔔</div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <strong style="color:var(--red);font-size:15px;">
                  ${pending.length > 1 ? `${pending.length} NEW ORDERS WAITING` : `NEW ORDER · ${escapeHtml(newest.orderNumber)}`}
                </strong>
                <span class="alarm-countdown">${ringing ? formatAlarmTime(alarmState.remainingSec) : 'WAITING'}</span>
                <span class="pill amber">${escapeHtml(origin)} · ${fmtPkr(newest.totalPkr)}</span>
              </div>
              <div style="font-size:13px;margin-top:3px;">${escapeHtml(newest.customerName)} — ${summary}</div>
              ${ringing ? `<div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${pct}%;background:var(--red);"></div></div>` : ''}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            ${audioHint}
            <button class="btn-green" onclick="acceptIncomingOrder('${newest.id}')">✓ Accept Order</button>
            <button class="btn-danger" onclick="rejectIncomingOrder('${newest.id}')">✕ Reject</button>
            ${ringing ? `<button class="btn-sm" onclick="muteIncomingAlarm()">🔇 Mute</button>` : ''}
          </div>
        `;
      } else {
        banner.innerHTML = `
          <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:260px;">
            <div class="alarm-bell-badge">🔔</div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <strong style="color:var(--red);font-size:15px;">TEST 3-MINUTE CONTINUOUS ORDER ALARM</strong>
                <span class="alarm-countdown">${formatAlarmTime(alarmState.remainingSec)}</span>
              </div>
              <div class="muted" style="margin-top:3px;">Continuous ringing sound active — click Stop Test anytime.</div>
              <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:${pct}%;background:var(--red);"></div></div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${audioHint}
            <button class="btn-primary" onclick="toggleTestOrderAlarm()">■ Stop Test Alarm</button>
          </div>
        `;
      }
    }

    window.toggleOrderAlarm = () => {
      ensureAudioContext();
      alarmState.enabled = !alarmState.enabled;
      if (!alarmState.enabled) {
        stopAlarmCountdown();
        showToast('3-minute order sound alarm turned OFF.');
      } else {
        showToast('3-minute continuous order alarm armed!');
        const unsilenced = getPendingPlacedOrders().filter(o => !alarmState.silencedIds.has(o.id));
        if (unsilenced.length > 0 && alarmState.remainingSec <= 0) {
          triggerIncomingOrderAlarm(ALARM_DURATION_SEC);
        }
      }
      renderIncomingAlarmBanner();
    };

    window.toggleTestOrderAlarm = () => {
      ensureAudioContext();
      if (alarmState.testActive) {
        alarmState.testActive = false;
        syncAlarmWithOrders();
        showToast('Test alarm stopped.');
      } else {
        alarmState.testActive = true;
        if (state.portal === 'customer') {
          state.portal = 'admin';
          history.replaceState(null, '', '#admin');
          render();
        }
        triggerIncomingOrderAlarm(ALARM_DURATION_SEC);
        showToast('Testing 3-minute continuous order alarm — click Stop Test anytime.');
      }
    };

    window.muteIncomingAlarm = () => {
      getPendingPlacedOrders().forEach(o => alarmState.silencedIds.add(o.id));
      stopAlarmCountdown();
      showToast('Alarm muted for current order(s). Armed for next new order.');
      renderIncomingAlarmBanner();
    };

    // Unlock browser Web Audio on first user interaction anywhere in the PC portal
    ['pointerdown', 'keydown'].forEach(evt => {
      window.addEventListener(evt, () => {
        if (!alarmState.audioUnlocked) ensureAudioContext();
      }, { passive: true });
    });

    // Cross-tab sync: if Customer Menu places an order in another tab, ring Admin/POS/Kitchen immediately
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEYS.ORDERS) {
        const prevPlacedIds = new Set(getPendingPlacedOrders().map(o => o.id));
        state.orders = loadJson(STORAGE_KEYS.ORDERS, []);
        const newPlaced = getPendingPlacedOrders().filter(o => !prevPlacedIds.has(o.id));
        if (newPlaced.length > 0 && alarmState.enabled) {
          triggerIncomingOrderAlarm(ALARM_DURATION_SEC);
        } else {
          syncAlarmWithOrders();
        }
        render();
      }
    });

    const _origRender = render;
    render = function() {
      _origRender();
      syncAlarmAudioPlayback();
      renderIncomingAlarmBanner();
    };

    window.addEventListener('online', updateNetworkBadge);
    window.addEventListener('offline', updateNetworkBadge);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    applyTableFromUrl();
    // On page load, ring for any unaccepted order placed in the last 3 minutes
    const initialPending = getPendingPlacedOrders();
    if (initialPending.length > 0 && isStaffOrAdminPortal()) {
      const ageSec = Math.max(0, Math.floor((Date.now() - (initialPending[0].createdAt || Date.now())) / 1000));
      const rem = ALARM_DURATION_SEC - ageSec;
      if (rem > 0) triggerIncomingOrderAlarm(rem);
    }
    render();
    if (state.custTableLabel) {
      showToast(`Checked into ${state.custTableLabel} — ready to order directly to Kitchen!`);
    }
  </script>
</body>
</html>
